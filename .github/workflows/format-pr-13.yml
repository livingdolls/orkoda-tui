name: Format PR 13

on:
  push:
    branches: [feat/planning-agent-open-questions]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planning-agent-open-questions
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Format source and normalize fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("internal/planningagent/service_test.go")
          path.write_text(path.read_text().replace(
              r'`{\"summary\":\"Need input\",\"steps\":[],\"open_questions\":[\"Which API?\"],\"risks\":[]}`',
              r'`{"summary":"Need input","steps":[],"open_questions":["Which API?"],"risks":[]}`',
          ))
          PY
          gofmt -w cmd internal
          bunx biome check --write apps packages
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal apps packages
            git commit -m "style: format planning agent feature"
            git push origin HEAD:feat/planning-agent-open-questions
          fi
