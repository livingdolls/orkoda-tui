name: Format diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Show gofmt diff
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -l cmd internal)"
