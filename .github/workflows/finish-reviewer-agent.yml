name: Finish Reviewer Agent

on:
  push:
    branches: [feat/reviewer-agent]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviewer-agent
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Patch backlog and UI limit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          task = Path('docs/task.md')
          text = task.read_text()
          replacements = {
              '- [ ] Migration reviews, revisions, dan approvals.': '- [x] Migration review runs dan review issues.\n- [ ] Migration revisions dan approvals.',
              '- [ ] Tambahkan idempotency pada reviewer dan publication handler.': '- [x] Tambahkan idempotency pada handler `workflow.review`.\n- [ ] Tambahkan idempotency pada publication handler.',
              '- [ ] Tambahkan crash-recovery dan duplicate-processing tests untuk tahap lain.': '- [x] Tambahkan crash-recovery dan duplicate-processing tests untuk reviewer.\n- [ ] Tambahkan crash-recovery dan duplicate-processing tests untuk publication.',
              '- [ ] Buat Reviewer prompt dan structured review schema.': '- [x] Buat Reviewer prompt dan structured review schema.',
              '- [ ] Validasi file reference, severity, blocking flag, dan criteria.': '- [x] Validasi file reference, severity, blocking flag, dan criteria.',
              '- [ ] Buat review issue panel.': '- [x] Buat review issue panel read-only pada Jobs screen.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing backlog marker: {old}')
              text = text.replace(old, new, 1)
          task.write_text(text)

          screen = Path('apps/tui/src/jobs-screen.tsx')
          text = screen.read_text()
          old = '      {entries.map((entry) => ('
          new = '      {entries.slice(0, 20).map((entry) => ('
          if old not in text:
              raise SystemExit('missing jobs screen list marker')
          screen.write_text(text.replace(old, new, 1))
          PY
      - run: gofmt -w cmd internal
      - run: bun install
      - run: bunx biome check --write apps packages
      - name: Commit final formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd internal apps packages docs/task.md
          git commit -m 'chore: format and finalize Reviewer Agent'
          git push origin HEAD:feat/reviewer-agent
