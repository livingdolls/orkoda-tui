name: Format durable checks TUI

on:
  push:
    branches: [feat/durable-checks-runner]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-checks-runner
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bunx biome check --write apps packages
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps packages
          git commit -m 'chore: format durable checks TUI'
          git push origin HEAD:feat/durable-checks-runner
