name: Apply provider backend

on:
  push:
    branches:
      - feat/tui-provider-setup
    paths:
      - scripts/apply_provider_backend.py
      - .github/workflows/apply-provider-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tui-provider-setup
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Apply provider backend
        run: python3 scripts/apply_provider_backend.py
      - name: Format Go
        run: gofmt -w cmd internal
      - name: Validate backend
        run: go test ./...
      - name: Commit final backend
        run: |
          rm -f scripts/apply_provider_backend.py .github/workflows/apply-provider-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add runtime LLM provider configuration" || exit 0
          git push origin HEAD:feat/tui-provider-setup
