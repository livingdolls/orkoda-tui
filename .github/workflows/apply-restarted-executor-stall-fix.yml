name: Apply restarted executor stall fix

on:
  push:
    branches:
      - fix/restarted-executor-stall
    paths:
      - scripts/fix_restarted_executor_stall.py
      - scripts/fix_recovery_query_deadlock.py
      - .github/workflows/apply-restarted-executor-stall-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restarted-executor-stall
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply fix
        run: |
          python3 scripts/fix_restarted_executor_stall.py
          python3 scripts/fix_recovery_query_deadlock.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit fix
        run: |
          rm -f scripts/fix_restarted_executor_stall.py
          rm -f scripts/fix_recovery_query_deadlock.py
          rm -f .github/workflows/apply-restarted-executor-stall-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover stalled restarted executors" || exit 0
          git push origin HEAD:fix/restarted-executor-stall
