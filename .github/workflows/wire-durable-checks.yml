name: Wire durable checks

on:
  push:
    branches: [feat/durable-checks-runner]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-checks-runner
      - name: Wire daemon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmd/api/main.go')
          text = path.read_text()
          text = text.replace(
              '"github.com/livingdolls/orkoda-tui/internal/agentconfig"\n',
              '"github.com/livingdolls/orkoda-tui/internal/agentconfig"\n\t"github.com/livingdolls/orkoda-tui/internal/checks"\n',
              1,
          )
          text = text.replace(
              '''\texecutionRepository, err := execution.NewRepository(db)
\tif err != nil {
\t\treturn err
\t}
''',
              '''\texecutionRepository, err := execution.NewRepository(db)
\tif err != nil {
\t\treturn err
\t}
\tcheckRepository, err := checks.NewRepository(db)
\tif err != nil {
\t\treturn err
\t}
''',
              1,
          )
          marker = '''\tif err != nil {
\t\treturn err
\t}
\tlogger.Info(
\t\t"workspace runtime ready",
'''
          replacement = '''\tif err != nil {
\t\treturn err
\t}
\tcheckHandler, err := checks.NewHandler(
\t\tworkflowJobRepository,
\t\texecutionRepository,
\t\tworkspaceRepository,
\t\tcheckRepository,
\t\tchecks.NewDetector(),
\t\tchecks.CommandRunner{},
\t\tactivityRecorder,
\t\tworkerID,
\t\tcfg.WorkspaceLeaseTTL,
\t)
\tif err != nil {
\t\treturn err
\t}
\tlogger.Info(
\t\t"workspace runtime ready",
'''
          if marker not in text:
              raise SystemExit('handler marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '"workflow.execute":           executeHandler.HandleDurable,\n',
              '"workflow.execute":           executeHandler.HandleDurable,\n\t\t\t"workflow.run_checks":        checkHandler.HandleDurable,\n',
              1,
          )
          text = text.replace(
              '\t\t\t\tExecutions:          executionRepository,\n',
              '\t\t\t\tExecutions:          executionRepository,\n\t\t\t\tChecks:              checkRepository,\n',
              1,
          )
          path.write_text(text)
          PY
          gofmt -w cmd/api/main.go
      - name: Commit daemon wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/api/main.go
          git commit -m 'feat: wire durable checks runtime'
          git push origin HEAD:feat/durable-checks-runner
