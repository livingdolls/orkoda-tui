name: Harden executor startup recovery

on:
  push:
    branches:
      - fix/executor-live-progress-watchdog
    paths:
      - scripts/harden_executor_startup_recovery.py
      - scripts/normalize_hardening_script.py
      - .github/workflows/harden-executor-startup-recovery.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executor-live-progress-watchdog
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply hardening
        run: |
          python3 scripts/normalize_hardening_script.py
          python3 scripts/harden_executor_startup_recovery.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit hardening
        run: |
          rm -f scripts/harden_executor_startup_recovery.py
          rm -f scripts/normalize_hardening_script.py
          rm -f .github/workflows/harden-executor-startup-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover interrupted Executor state on startup" || exit 0
          git push origin HEAD:fix/executor-live-progress-watchdog
