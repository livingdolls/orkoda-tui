name: Apply Board keyboard fix

on:
  push:
    branches: [fix/board-action-menu-keyboard]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/board-action-menu-keyboard
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: bun install
      - name: Apply source and E2E fix
        run: python3 scripts/apply_board_keyboard_fix.py
      - name: Format and validate TUI
        run: |
          bunx biome check --write apps packages
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Run real-daemon keyboard E2E
        env:
          ORKODA_TUI_E2E: "1"
          ORKODA_E2E_GO_BIN: /opt/hostedtoolcache/go/1.26.5/x64/bin/go
        run: bun test apps/tui/src/app.e2e.test.tsx
      - name: Commit final fix
        run: |
          git rm .github/workflows/apply-board-keyboard-fix.yml scripts/apply_board_keyboard_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tui/src/board-screen.tsx apps/tui/src/app.e2e.test.tsx
          git commit -m "fix(tui): keep Board action menu keyboard responsive"
          git push origin HEAD:fix/board-action-menu-keyboard
