name: Format PR 12

on:
  push:
    branches: [feat/provider-neutral-llm-gateway]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-neutral-llm-gateway
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Normalize fixtures and format source
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              "internal/llm/gateway_test.go",
              "internal/planningagent/prompt_test.go",
          ]:
              path = Path(name)
              path.write_text(path.read_text().replace('\\"', '"'))
          PY
          gofmt -w internal/llm internal/planningagent
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/llm internal/planningagent
            git commit -m "style: format LLM gateway feature"
            git push origin HEAD:feat/provider-neutral-llm-gateway
          fi
