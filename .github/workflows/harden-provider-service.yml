name: Harden provider service

on:
  push:
    branches:
      - feat/tui-provider-setup
    paths:
      - scripts/harden_provider_service.py
      - .github/workflows/harden-provider-service.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tui-provider-setup
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply hardening
        run: python3 scripts/harden_provider_service.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate all tests
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit final hardening
        run: |
          rm -f scripts/harden_provider_service.py .github/workflows/harden-provider-service.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden runtime provider credentials" || exit 0
          git push origin HEAD:feat/tui-provider-setup
