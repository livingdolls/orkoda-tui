name: Fix execution JSON scans

on:
  push:
    branches: [feat/llm-executor-loop]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-executor-loop
      - name: Fix SQLite JSON scans
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/execution/repository.go')
          text = path.read_text()
          old = '''\t\tvar item Checkpoint
\t\tvar created int64
\t\tif err := rows.Scan(&item.ID, &item.ExecutionID, &item.Sequence, &item.BaseCommitSHA, &item.WorkspaceHeadSHA, &item.PatchChecksum, &item.PatchBytes, &item.ChangedFilesJSON, &item.PatchText, &created); err != nil {
\t\t\treturn nil, err
\t\t}
\t\titem.CreatedAt = time.UnixMilli(created).UTC()
'''
          new = '''\t\tvar item Checkpoint
\t\tvar changedFiles string
\t\tvar created int64
\t\tif err := rows.Scan(&item.ID, &item.ExecutionID, &item.Sequence, &item.BaseCommitSHA, &item.WorkspaceHeadSHA, &item.PatchChecksum, &item.PatchBytes, &changedFiles, &item.PatchText, &created); err != nil {
\t\t\treturn nil, err
\t\t}
\t\titem.ChangedFilesJSON = json.RawMessage(changedFiles)
\t\titem.CreatedAt = time.UnixMilli(created).UTC()
'''
          if old not in text:
              raise SystemExit('checkpoint scanner block not found')
          text = text.replace(old, new, 1)
          old = '''\tvar code, message sql.NullString
\tvar started, completed sql.NullInt64
\tvar created, updated int64
\terr := row.Scan(&item.ID, &item.ExecutionID, &item.Sequence, &item.Tool, &item.Status, &item.InputSummaryJSON, &item.OutputSummaryJSON, &code, &message, &started, &completed, &created, &updated)
\tif err != nil {
\t\treturn ToolRun{}, err
\t}
\titem.ErrorCode = code.String
'''
          new = '''\tvar code, message sql.NullString
\tvar inputSummary, outputSummary string
\tvar started, completed sql.NullInt64
\tvar created, updated int64
\terr := row.Scan(&item.ID, &item.ExecutionID, &item.Sequence, &item.Tool, &item.Status, &inputSummary, &outputSummary, &code, &message, &started, &completed, &created, &updated)
\tif err != nil {
\t\treturn ToolRun{}, err
\t}
\titem.InputSummaryJSON = json.RawMessage(inputSummary)
\titem.OutputSummaryJSON = json.RawMessage(outputSummary)
\titem.ErrorCode = code.String
'''
          if old not in text:
              raise SystemExit('tool-run scanner block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/execution/repository.go
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/execution/repository.go
          git commit -m 'fix: decode execution repository JSON fields'
          git push origin HEAD:feat/llm-executor-loop
