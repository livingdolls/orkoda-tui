name: Fix PR 12 fixtures

on:
  push:
    branches: [feat/provider-neutral-llm-gateway]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-neutral-llm-gateway
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Normalize JSON fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          escaped_quote = chr(92) + chr(34)
          for name in [
              "internal/llm/gateway_test.go",
              "internal/planningagent/prompt_test.go",
          ]:
              path = Path(name)
              path.write_text(path.read_text().replace(escaped_quote, chr(34)))
          PY
          gofmt -w internal/llm internal/planningagent
      - name: Commit fixture fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/llm internal/planningagent
            git commit -m "test: normalize LLM JSON fixtures"
            git push origin HEAD:feat/provider-neutral-llm-gateway
          fi
