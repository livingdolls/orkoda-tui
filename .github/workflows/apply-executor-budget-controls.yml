name: Apply executor budget controls

on:
  push:
    branches:
      - feat/executor-budget-controls
    paths:
      - scripts/apply_executor_budget_controls.py
      - scripts/fix_executor_budget_generated.py
      - .github/workflows/apply-executor-budget-controls.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/executor-budget-controls
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply implementation
        run: |
          python3 scripts/apply_executor_budget_controls.py
          python3 scripts/fix_executor_budget_generated.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit implementation
        run: |
          rm -f scripts/apply_executor_budget_controls.py
          rm -f scripts/fix_executor_budget_generated.py
          rm -f .github/workflows/apply-executor-budget-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add resilient executor budget controls" || exit 0
          git push origin HEAD:feat/executor-budget-controls
