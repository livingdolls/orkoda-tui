name: Format executor loop

on:
  push:
    branches: [feat/llm-executor-loop]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-executor-loop
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - run: gofmt -w cmd internal
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd internal
          git commit -m 'chore: format autonomous executor loop'
          git push origin HEAD:feat/llm-executor-loop
