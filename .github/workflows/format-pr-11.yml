name: Format PR 11

on:
  push:
    branches: [feat/repository-summary-plan-normalization]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repository-summary-plan-normalization
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Format source
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps packages
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal apps packages
            git commit -m "style: format repository planning feature"
            git push origin HEAD:feat/repository-summary-plan-normalization
          fi
