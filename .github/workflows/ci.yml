name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-planning-lifecycle-fix:
    name: Apply planning lifecycle fix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/planning-run-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-run-lifecycle
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: bun install
      - name: Apply source fixes
        run: python3 scripts/apply_planning_run_lifecycle_fix.py
      - name: Format sources
        run: |
          bunx biome check --write apps packages
          gofmt -w cmd internal
      - name: Validate TUI
        run: |
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Validate Go
        run: go test ./...
      - name: Commit final fix
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/apply_planning_run_lifecycle_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tui/src/planning-agent.ts apps/tui/src/board-screen.tsx internal/planningagent/service.go internal/planningagent/service_test.go cmd/api/main.go .github/workflows/ci.yml scripts/apply_planning_run_lifecycle_fix.py
          git commit -m "fix: complete and recover planning run lifecycle"
          git push origin HEAD:fix/planning-run-lifecycle

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go modules
        run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build sandbox image
        run: docker build --file Dockerfile.sandbox --tag orkoda-sandbox:ci .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --no-banner --config .gitleaks.toml

  tui:
    name: TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run lint:ts
      - run: bun run typecheck
      - run: bun run test:ts
