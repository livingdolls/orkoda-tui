name: Apply Board keyboard fix

on:
  pull_request:
  push:
    branches: [fix/board-action-menu-keyboard]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/board-action-menu-keyboard
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: bun install
      - name: Patch action-menu input routing
        run: |
          python3 <<'PY'
          from pathlib import Path

          board = Path("apps/tui/src/board-screen.tsx")
          source = board.read_text()

          old_event = '''  useEffect(() => {
            if (!lastEvent || mode !== "board") return
            const timeout = setTimeout(() => void reload(), 120)
            return () => clearTimeout(timeout)
          }, [lastEvent, mode, reload])'''
          new_event = '''  useEffect(() => {
            if (!lastEvent || mode !== "board" || actionMenuOpen) return
            const timeout = setTimeout(() => void reload(), 120)
            return () => clearTimeout(timeout)
          }, [lastEvent, mode, actionMenuOpen, reload])'''
          if old_event not in source:
              raise SystemExit("SSE reload block did not match expected source")
          source = source.replace(old_event, new_event, 1)

          old_keyboard = '''  useKeyboard((key) => {
            if (mode !== "board" || busy || loadState === "loading") return

            if (actionMenuOpen) {'''
          new_keyboard = '''  useKeyboard((key) => {
            if (mode !== "board") return

            // Modal input must stay responsive even if an SSE refresh is already in flight.
            // In particular, Escape must always provide a way out of the action menu.
            if (actionMenuOpen) {'''
          if old_keyboard not in source:
              raise SystemExit("keyboard guard did not match expected source")
          source = source.replace(old_keyboard, new_keyboard, 1)

          old_after_menu = '''      }
              return
            }

            if (key.shift && key.name === "n") {'''
          new_after_menu = '''      }
              return
            }

            if (busy || loadState === "loading") return

            if (key.shift && key.name === "n") {'''
          if old_after_menu not in source:
              raise SystemExit("action-menu tail did not match expected source")
          source = source.replace(old_after_menu, new_after_menu, 1)
          board.write_text(source)

          e2e = Path("apps/tui/src/app.e2e.test.tsx")
          test_source = e2e.read_text()
          old_test = '''        await act(async () => {
                    await setup.mockInput.pressKey("enter")
                  })
                  const detailFrame = await waitForTUIFrame('''
          new_test = '''        await act(async () => {
                    await setup.mockInput.pressKey("space")
                  })
                  const actionMenuFrame = await waitForTUIFrame(
                    setup,
                    (frame) => frame.includes("What do you want to do?") && frame.includes("Open workflow evidence"),
                  )
                  expect(actionMenuFrame).toContain("Enter  run action")

                  await act(async () => {
                    await setup.mockInput.pressKey("enter")
                  })
                  const detailFrame = await waitForTUIFrame('''
          if old_test not in test_source:
              raise SystemExit("E2E detail-opening block did not match expected source")
          e2e.write_text(test_source.replace(old_test, new_test, 1))
          PY
      - name: Format and validate TUI
        run: |
          bunx biome check --write apps packages
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Run real-daemon action-menu E2E
        env:
          ORKODA_TUI_E2E: "1"
          ORKODA_E2E_GO_BIN: /opt/hostedtoolcache/go/1.26.5/x64/bin/go
        run: bun test apps/tui/src/app.e2e.test.tsx
      - name: Restore production CI and commit fix
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/tui/src/board-screen.tsx apps/tui/src/app.e2e.test.tsx
          git commit -m "fix(tui): keep Board action menu keyboard responsive"
          git push origin HEAD:fix/board-action-menu-keyboard
