name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-approval:
    name: Format approval branch
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/version-bound-approvals
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Patch approval recovery and TUI types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('internal/approval/service.go')
          text = service.read_text()
          marker = '\n\tcreateInput := CreateInput{'
          block = '''
\trevisionCountBefore := job.RevisionCount
\texistingDecision, existingErr := s.decisions.GetByVersion(ctx, workflowID, input.ExecutionVersion)
\tswitch {
\tcase existingErr == nil:
\t\trevisionCountBefore = existingDecision.RevisionCountBefore
\tcase errors.Is(existingErr, ErrNotFound):
\t\tif job.Status != workflowjob.StatusWaitingApproval ||
\t\t\tjob.Version != input.ExpectedVersion ||
\t\t\tjob.ExecutionVersion != input.ExecutionVersion {
\t\t\treturn Outcome{}, ErrWorkflowNotAwaitingDecision
\t\t}
\tdefault:
\t\treturn Outcome{}, existingErr
\t}

\tcreateInput := CreateInput{'''
          if marker not in text:
              raise SystemExit('missing approval create-input marker')
          text = text.replace(marker, '\n' + block, 1)
          old = '\t\tRevisionCountBefore:   job.RevisionCount,\n'
          new = '\t\tRevisionCountBefore:   revisionCountBefore,\n'
          if old not in text:
              raise SystemExit('missing revision count assignment')
          service.write_text(text.replace(old, new, 1))

          screen = Path('apps/tui/src/jobs-screen.tsx')
          text = screen.read_text()
          old = 'import { useCallback, useEffect, useRef, useState } from "react"'
          new = 'import { type RefObject, useCallback, useEffect, useRef, useState } from "react"'
          if old not in text:
              raise SystemExit('missing React hooks import')
          text = text.replace(old, new, 1)
          old = '  noteRef: React.RefObject<TextareaRenderable | null>\n'
          new = '  noteRef: RefObject<TextareaRenderable | null>\n'
          if old not in text:
              raise SystemExit('missing React.RefObject annotation')
          screen.write_text(text.replace(old, new, 1))

          tests = Path('internal/approval/service_test.go')
          text = tests.read_text()
          if 'TestServiceMarksAlreadyQueuedRevisionApplied' not in text:
              text += r'''

func TestServiceMarksAlreadyQueuedRevisionApplied(t *testing.T) {
	service, decisions, workflows := approvalFixture(reviewer.VerdictRequestRevision)
	input := boundInput()
	input.Note = "Fix the blocking issue."
	decisions.item = &Decision{
		ID: "decision-1", WorkflowJobID: "workflow-1", ReviewRunID: "review-1",
		ExecutionID: "execution-1", ExecutionVersion: 1, CheckpointID: "checkpoint-1",
		BaseCommitSHA: "abc123", PatchChecksum: "sha256:patch",
		Kind: KindRequestRevision, Status: StatusPending, Note: input.Note,
		RevisionInstructions: input.Note, ReviewerVerdict: "REQUEST_REVISION",
		WorkflowVersionBefore: 8, RevisionCountBefore: 0,
	}
	workflows.job.Status = workflowjob.StatusQueued
	workflows.job.Version = 10
	workflows.job.RevisionCount = 1

	outcome, err := service.Decide(context.Background(), "workflow-1", KindRequestRevision, input)
	if err != nil {
		t.Fatal(err)
	}
	if outcome.Workflow.Status != workflowjob.StatusQueued || len(workflows.actions) != 0 {
		t.Fatalf("outcome=%#v actions=%#v", outcome, workflows.actions)
	}
	if outcome.Decision.Status != StatusApplied || outcome.Decision.WorkflowVersionAfter != 10 {
		t.Fatalf("decision = %#v", outcome.Decision)
	}
}
'''
              tests.write_text(text)
          PY
      - run: gofmt -w cmd internal
      - run: bun install
      - run: bunx biome check --write apps packages
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd internal apps packages
          git commit -m 'fix: finalize version-bound approval recovery'
          git push origin HEAD:feat/version-bound-approvals

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go modules
        run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...

  tui:
    name: TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run lint:ts
      - run: bun run typecheck
      - run: bun run test:ts
