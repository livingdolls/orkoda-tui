name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go modules
        run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build sandbox image
        run: docker build --file Dockerfile.sandbox --tag orkoda-sandbox:ci .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --no-banner --config .gitleaks.toml

  tui:
    name: TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Generate exact Biome-formatted source
        run: |
          bunx biome check --write apps packages
          tar -czf /tmp/biome-formatted.tar.gz apps/tui/src
      - name: Upload exact Biome-formatted source
        uses: actions/upload-artifact@v4
        with:
          name: biome-formatted-source
          path: /tmp/biome-formatted.tar.gz
          retention-days: 1
      - run: bun run lint:ts
      - run: bun run typecheck
      - run: bun run test:ts
