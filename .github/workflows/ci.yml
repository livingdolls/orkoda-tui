name: Apply Board keyboard fix

on:
  pull_request:
  push:
    branches: [fix/board-action-menu-keyboard]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/board-action-menu-keyboard
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: bun install
      - name: Patch action-menu input routing
        run: |
          python3 <<'PY'
          from pathlib import Path

          board = Path("apps/tui/src/board-screen.tsx")
          source = board.read_text()

          old_event = (
              '    if (!lastEvent || mode !== "board") return\n'
              '    const timeout = setTimeout(() => void reload(), 120)\n'
              '    return () => clearTimeout(timeout)\n'
              '  }, [lastEvent, mode, reload])'
          )
          new_event = (
              '    if (!lastEvent || mode !== "board" || actionMenuOpen) return\n'
              '    const timeout = setTimeout(() => void reload(), 120)\n'
              '    return () => clearTimeout(timeout)\n'
              '  }, [lastEvent, mode, actionMenuOpen, reload])'
          )
          if source.count(old_event) != 1:
              raise SystemExit(f"expected one SSE reload block, found {source.count(old_event)}")
          source = source.replace(old_event, new_event, 1)

          old_keyboard = (
              '  useKeyboard((key) => {\n'
              '    if (mode !== "board" || busy || loadState === "loading") return\n\n'
              '    if (actionMenuOpen) {'
          )
          new_keyboard = (
              '  useKeyboard((key) => {\n'
              '    if (mode !== "board") return\n\n'
              '    // Modal input must stay responsive even if an SSE refresh is already in flight.\n'
              '    // In particular, Escape must always provide a way out of the action menu.\n'
              '    if (actionMenuOpen) {'
          )
          if source.count(old_keyboard) != 1:
              raise SystemExit(f"expected one keyboard guard, found {source.count(old_keyboard)}")
          source = source.replace(old_keyboard, new_keyboard, 1)

          normal_input_start = '    if (key.shift && key.name === "n") {'
          guarded_input_start = (
              '    if (busy) return\n\n'
              '    if (key.shift && key.name === "n") {'
          )
          if source.count(normal_input_start) != 1:
              raise SystemExit(
                  f"expected one normal input block, found {source.count(normal_input_start)}"
              )
          source = source.replace(normal_input_start, guarded_input_start, 1)
          board.write_text(source)

          e2e = Path("apps/tui/src/app.e2e.test.tsx")
          test_source = e2e.read_text()
          old_test = (
              '        await act(async () => {\n'
              '          await setup.mockInput.pressKey("enter")\n'
              '        })\n'
              '        const detailFrame = await waitForTUIFrame('
          )
          new_test = (
              '        await act(async () => {\n'
              '          await setup.mockInput.pressKey("space")\n'
              '        })\n'
              '        const actionMenuFrame = await waitForTUIFrame(\n'
              '          setup,\n'
              '          (frame) =>\n'
              '            frame.includes("What do you want to do?") &&\n'
              '            frame.includes("Kanban approval flow"),\n'
              '        )\n'
              '        expect(actionMenuFrame).toContain("run action")\n\n'
              '        await act(async () => {\n'
              '          await setup.mockInput.pressKey("enter")\n'
              '        })\n'
              '        const detailFrame = await waitForTUIFrame('
          )
          if test_source.count(old_test) != 1:
              raise SystemExit(f"expected one E2E detail block, found {test_source.count(old_test)}")
          e2e.write_text(test_source.replace(old_test, new_test, 1))
          PY
      - name: Format and validate TUI
        run: |
          bunx biome check --write apps packages
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Run real-daemon action-menu E2E
        env:
          ORKODA_TUI_E2E: "1"
          ORKODA_E2E_GO_BIN: /opt/hostedtoolcache/go/1.26.5/x64/bin/go
        run: bun test apps/tui/src/app.e2e.test.tsx
      - name: Restore production CI and commit fix
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/tui/src/board-screen.tsx apps/tui/src/app.e2e.test.tsx
          git commit -m "fix(tui): keep Board action menu keyboard responsive"
          git push origin HEAD:fix/board-action-menu-keyboard
