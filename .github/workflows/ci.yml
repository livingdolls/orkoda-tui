name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-board:
    name: Format Board
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Apply Biome formatting and safe fixes
        run: bunx biome check --write apps packages
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            echo "Source is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          git commit -m "style(tui): apply Biome fixes to unified board"
          git push origin HEAD:${{ github.head_ref }}

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go modules
        run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build sandbox image
        run: docker build --file Dockerfile.sandbox --tag orkoda-sandbox:ci .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --no-banner --config .gitleaks.toml

  tui:
    name: TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run lint:ts
      - run: bun run typecheck
      - run: bun run test:ts
