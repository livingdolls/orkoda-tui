name: Apply Board keyboard fix

on:
  pull_request:
  push:
    branches: [fix/board-action-menu-keyboard]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/board-action-menu-keyboard
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Apply source and regression fix
        run: python3 scripts/apply_board_keyboard_fix.py
      - name: Format and validate TUI
        run: |
          bunx biome check --write apps packages
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit final fix
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/apply-board-keyboard-fix.yml scripts/apply_board_keyboard_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/tui/src/board-screen.tsx apps/tui/src/board-keyboard.ts apps/tui/src/board-keyboard.test.ts
          git commit -m "fix(tui): keep Board action menu keyboard responsive"
          git push origin HEAD:fix/board-action-menu-keyboard
