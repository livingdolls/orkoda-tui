name: Apply workflow agent selection

on:
  push:
    branches:
      - feat/workflow-agent-selection
    paths:
      - scripts/apply_workflow_agent_selection.py
      - .github/workflows/apply-workflow-agent-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-agent-selection
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply workflow agent selection
        run: |
          python3 scripts/apply_workflow_agent_selection.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/tui/src/workflow-agent-picker.tsx")
          text = path.read_text()
          text = text.replace('AgentChoiceCard role="Executor"', 'AgentChoiceCard label="Executor"')
          text = text.replace('AgentChoiceCard role="Reviewer"', 'AgentChoiceCard label="Reviewer"')
          text = text.replace('  role,\n  active,', '  label,\n  active,')
          text = text.replace('  role: "Executor" | "Reviewer"', '  label: "Executor" | "Reviewer"')
          text = text.replace('        {role}\n', '        {label}\n')
          path.write_text(text)

          path = Path("apps/tui/src/workflow-jobs.ts")
          text = path.read_text()
          text = text.replace(
              "  agent_settings_version: number\n  executor: WorkflowAgentSelection\n  reviewer: WorkflowAgentSelection\n",
              "  agent_settings_version?: number\n  executor?: WorkflowAgentSelection\n  reviewer?: WorkflowAgentSelection\n",
          )
          path.write_text(text)
          PY
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate all tests
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit final implementation
        run: |
          rm -f scripts/apply_workflow_agent_selection.py .github/workflows/apply-workflow-agent-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: select executor and reviewer per workflow" || exit 0
          git push origin HEAD:feat/workflow-agent-selection
