name: Apply workflow failure UI fix

on:
  push:
    branches: [fix/workflow-failure-explanation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/workflow-failure-explanation' || github.ref_name == 'fix/workflow-failure-explanation'
    name: Apply workflow failure explanation fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workflow-failure-explanation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Apply source patch
        run: python3 scripts/apply_workflow_failure_ui.py
      - name: Format and validate
        run: |
          bunx biome format --write apps/tui/src/board-model.ts apps/tui/src/board-model.test.ts apps/tui/src/board-screen.tsx apps/tui/src/board-detail.tsx apps/tui/src/workflow-failure.ts apps/tui/src/workflow-failure.test.ts
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit final source changes
        run: |
          rm .github/workflows/apply-workflow-failure-ui.yml scripts/apply_workflow_failure_ui.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/tui/src .github/workflows/apply-workflow-failure-ui.yml scripts/apply_workflow_failure_ui.py
          git commit -m "fix: explain workflow failures in Board"
          git push origin HEAD:fix/workflow-failure-explanation
