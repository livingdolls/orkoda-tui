name: Implement failed workflow restart

on:
  push:
    branches:
      - feat/restart-failed-workflow
    paths:
      - scripts/implement_restart_failed_workflow.py
      - .github/workflows/implement-restart-failed-workflow.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restart-failed-workflow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply implementation
        run: python3 scripts/implement_restart_failed_workflow.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit implementation
        run: |
          rm -f scripts/implement_restart_failed_workflow.py
          rm -f .github/workflows/implement-restart-failed-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restart failed workflows from pinned base" || exit 0
          git push origin HEAD:feat/restart-failed-workflow
