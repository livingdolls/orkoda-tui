name: Implement failed workflow restart

on:
  push:
    branches:
      - feat/restart-failed-workflow
    paths:
      - scripts/implement_restart_failed_workflow.py
      - .github/workflows/implement-restart-failed-workflow.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restart-failed-workflow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/implement_restart_failed_workflow.py")
          text = path.read_text()
          text = text.replace(
              "def replace_once(path: str, old: str, new: str) -> None:\n    content = read(path)",
              "def source(value: str) -> str:\n    return value.replace(chr(92) + 't', chr(9))\n\n\ndef replace_once(path: str, old: str, new: str) -> None:\n    old = source(old)\n    new = source(new)\n    content = read(path)",
              1,
          )
          text = text.replace(
              "def append_once(path: str, marker: str, content: str) -> None:\n    current = read(path)",
              "def append_once(path: str, marker: str, content: str) -> None:\n    content = source(content)\n    current = read(path)",
              1,
          )
          text = text.replace(
              "def create_once(path: str, content: str) -> None:\n    target = Path(path)",
              "def create_once(path: str, content: str) -> None:\n    content = source(content)\n    target = Path(path)",
              1,
          )
          path.write_text(text)
          PY
          python3 scripts/implement_restart_failed_workflow.py
      - name: Format
        run: |
          gofmt -w cmd internal
          bunx biome check --write apps/tui/src
      - name: Validate
        run: |
          go test ./...
          bun run lint:ts
          bun run typecheck
          bun run test:ts
      - name: Commit implementation
        run: |
          rm -f scripts/implement_restart_failed_workflow.py
          rm -f .github/workflows/implement-restart-failed-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restart failed workflows from pinned base" || exit 0
          git push origin HEAD:feat/restart-failed-workflow
